[project]
    name        = "DushuoServer"
    dynamic     = ["version"]
    description = "度朔-服务端"

    readme = "README.md"

    authors = [
        { name = "Eilles", email = "W-YI_DoctorYI@outlook.com" },
    ]

    requires-python = ">=3.10, <4.0"
    dependencies = [
        "fastapi>=0.162.0, <1.0.0",
        "qrcode[pil]>=8.2, <9.0.0",
        "uvicorn[standard]>=0.54.0, <1.0.0",
        "tomli>=2.0.0; python_version < \"3.11\"",
        "trimlog>=1.1.1, <2.0.0",
    ]

[project.scripts]
    dushuoserver = "dushuoserver.main:main"


[project.optional-dependencies]
    test = [
        "pytest>=8.0",
        "httpx>=0.27",
    ]


[build-system]
    requires      = ["pdm-backend"]
    build-backend = "pdm.backend"

# # https://backend.pdm-project.org/build_config/#build-configurations
# [tool.pdm.build]
#     source-includes = [
#         "README",
#         "LICENSE",
#         "docs/"
#     ]
#     excludes = [
#         "tests/",
#     ]

[tool.pdm.version]
    source = "file"
    path   = "src/dushuoserver/__init__.py"

[tool.pytest.ini_options]
    pythonpath = ["src"]
    testpaths  = ["tests"]

[tool.pyright]
    typeCheckingMode = "standard"
