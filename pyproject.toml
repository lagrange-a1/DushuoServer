[project]
    name        = "DushuoServer"
    dynamic     = ["version"]
    description = "度朔系统之服务端，提供度朔中心调度功能"

    readme = "README.md"

    authors = [
        { name = "Eilles", email = "W-YI_DoctorYI@outlook.com" },
    ]

    requires-python = ">=3.10, <4.0"
    dependencies = [
        "fastapi>=0.162.0, <1.0.0",
        "qrcode[pil]>=8.2, <9.0.0",
        "uvicorn[standard]>=0.54.0, <1.0.0",
        "trimlog>=1.1.3, <2.0.0",
        "tomli>=2.0.0; python_version < \"3.11\"",
        "tomli-w>=1.2.0, <2.0.0",
        "pydantic>=2.14.3, <3.0.0",
        "cryptography>=44.0.0, <47.0.0",
    ]

[project.scripts]
    dushuoserver = "dushuoserver.main:main"


[project.optional-dependencies]
    dev = [
        "pytest>=8.0",
        "httpx>=0.27",
    ]


[build-system]
    requires      = ["pdm-backend"]
    build-backend = "pdm.backend"

# https://backend.pdm-project.org/build_config/#build-configurations
[tool.pdm.build]
    source-includes = [
        "README.md",
        "LICENSE",
        "docs/"
    ]
    # excludes = [
    #     "tests/",
    # ]

[tool.pdm.version]
    source = "file"
    path   = "src/dushuoserver/__init__.py"


[tool.pytest.ini_options]
    pythonpath = ["src"]
    testpaths  = ["tests"]

[tool.pyright]
    typeCheckingMode = "standard"
